<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Embed at kickoff, prototype by week 2, build by month 2 to 2.5, beta with real users by month 4 to 5">
<defs>
<style>
@font-face{font-family:"LG";src:url(data:font/woff2;base64,) format("woff2");}
.phase{font-family:"LG","League Gothic",sans-serif;}
.meta{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;}
.body{font-family:Georgia,"Times New Roman",serif;}
</style>
</defs>
<rect x="0" y="0" width="1200" height="260" fill="#0b0907"/>

<text class="meta" x="20" y="46" font-size="16" letter-spacing="2" fill="#efe6d4" opacity=".7">01 &#183; KICKOFF</text>
<text class="phase" x="20" y="132" font-size="56" letter-spacing="-1" fill="#efe6d4">EMBED</text>
<text class="body" x="20" y="176" font-size="18" fill="#efe6d4" opacity=".82"><tspan x="20" dy="0">Weekly calls with stakeholders.</tspan><tspan x="20" dy="24">Ambiguity becomes</tspan><tspan x="20" dy="24">an agent design.</tspan></text>
<text class="meta" x="320" y="46" font-size="16" letter-spacing="2" fill="#efe6d4" opacity=".7">02 &#183; WEEK 2</text>
<text class="phase" x="320" y="132" font-size="56" letter-spacing="-1" fill="#efe6d4">PROTOTYPE</text>
<text class="body" x="320" y="176" font-size="18" fill="#efe6d4" opacity=".82"><tspan x="320" dy="0">A working proof of concept</tspan><tspan x="320" dy="24">on the customer's real inputs.</tspan></text>
<text class="meta" x="620" y="46" font-size="16" letter-spacing="2" fill="#efe6d4" opacity=".7">03 &#183; MONTH 2&#8211;2.5</text>
<text class="phase" x="620" y="132" font-size="56" letter-spacing="-1" fill="#efe6d4">BUILD</text>
<text class="body" x="620" y="176" font-size="18" fill="#efe6d4" opacity=".82"><tspan x="620" dy="0">The agent, its guardrails,</tspan><tspan x="620" dy="24">the product around it.</tspan></text>
<text class="meta" x="920" y="46" font-size="16" letter-spacing="2" fill="#efe6d4" opacity=".7">04 &#183; MONTH 4&#8211;5</text>
<text class="phase" x="920" y="132" font-size="56" letter-spacing="-1" fill="#efe6d4">BETA</text>
<text class="body" x="920" y="176" font-size="18" fill="#efe6d4" opacity=".82"><tspan x="920" dy="0">Live with users the</tspan><tspan x="920" dy="24">customer chooses.</tspan></text>
<line x1="300" y1="0" x2="300" y2="260" stroke="#efe6d4" stroke-width="1" opacity=".25"/>
<line x1="600" y1="0" x2="600" y2="260" stroke="#efe6d4" stroke-width="1" opacity=".25"/>
<line x1="900" y1="0" x2="900" y2="260" stroke="#efe6d4" stroke-width="1" opacity=".25"/>
</svg>
